<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>f230 · Original-scan alignment</title>
<style>body{font:16px system-ui;background:#f4f1e9;margin:0}header{position:sticky;top:0;z-index:2;background:#fffdf5;padding:15px}main{max-width:1050px;margin:auto}article{padding:18px;margin:15px;background:white}.scan{position:relative}.scan img{display:block;width:100%}svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}label{margin-right:15px}p{font-size:14px}</style>
<header><b>f230 · Original-scan alignment experiment</b><p>These are ordinary scan crops, not straightened OCR images. Text positions and slopes are mapped back through the OCR extraction.</p><label>Show <input id="on" type="checkbox" checked></label><label>Above ↔ below <input id="dy" type="range" min="-40" max="40" value="0"></label><label>Size <input id="size" type="range" min="12" max="32" value="26"></label><label>Opacity <input id="opacity" type="range" min="0" max="100" value="65"></label></header><main></main>
<script>
const data=/*DATA*/,ns='http://www.w3.org/2000/svg',items=[];
for(const row of data.rows){const article=document.createElement('article');const label=document.createElement('p');label.textContent=row.id;article.append(label);document.querySelector('main').append(article);if(!row.image){article.append('Special initial: no alignment.');continue;}
const [cx,cy,w,h]=row.crop,scan=document.createElement('div');scan.className='scan';article.append(scan);const img=new Image();img.src=row.image;scan.append(img);const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);scan.append(svg);
let i=0;for(const run of row.runs)for(const char of run.text){let n=i++,a=row.alignment[n];const m=row.scan_mappings?.[n]||row.scan_mapping;if(!m)continue;
let start=n,end=n+1;if(a.kind==='uncertain'){while(start>0&&JSON.stringify(row.alignment[start-1])===JSON.stringify(a))start--;while(end<row.alignment.length&&JSON.stringify(row.alignment[end])===JSON.stringify(a))end++;}
const px=(a.left+a.width*(n-start+.5)/(end-start))*row.image_width/100,t=document.createElementNS(ns,'text');const space=/\s/.test(char);t.textContent=space?'␣':char;t.setAttribute('text-anchor','middle');t.setAttribute('font-family',space?'Arial, sans-serif':'Georgia,serif');t.setAttribute('font-style',!space&&run.typeface==='italic'?'italic':'normal');if(space){t.setAttribute('textLength',Math.max(3,a.width*row.image_width/100*.8));t.setAttribute('lengthAdjust','spacingAndGlyphs');}t.setAttribute('fill',a.kind==='uncertain'?'#c04400':'#006bff');svg.append(t);items.push({t,m,px,cx,cy});}
}
function update(){const dy=+document.querySelector('#dy').value;for(const {t,m,px,cx,cy} of items){const x=m.origin[0]+m.dx[0]*px+m.dy[0]*(35+dy)-cx,y=m.origin[1]+m.dx[1]*px+m.dy[1]*(35+dy)-cy;t.setAttribute('transform',`matrix(${m.dx[0]} ${m.dx[1]} ${m.dy[0]} ${m.dy[1]} ${x} ${y})`);t.setAttribute('font-size',document.querySelector('#size').value);}document.querySelectorAll('svg').forEach(s=>{s.style.opacity=document.querySelector('#opacity').value/100;s.style.display=document.querySelector('#on').checked?'block':'none';s.parentElement.style.marginBlock='75px';});}
document.querySelectorAll('input').forEach(i=>i.oninput=update);update();
</script>
